[package]
name = "lawh-render"
description = "Renders lawh whiteboards to pixels on the CPU, with a per-frame work budget"
keywords = ["whiteboard", "rendering", "vector"]
categories = ["graphics", "rendering"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
icu_properties = { workspace = true, features = ["compiled_data"] }
kurbo.workspace = true
lawh-core.workspace = true
lawh-math.workspace = true
parley.workspace = true
parley_data.workspace = true
# PNG export, with an sRGB chunk; already in the tree through vello_cpu.
png.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Glyph outline sizes for the frame budget; already in the tree through lawh-math.
ttf-parser.workspace = true
vello_cpu.workspace = true

[dev-dependencies]
# Snapshots of exported SVG files.
insta.workspace = true
# Draws exported SVGs to compare with PNG exports; checks their XML.
resvg.workspace = true
roxmltree.workspace = true

[lints]
workspace = true
