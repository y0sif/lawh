[package]
name = "lawh"
description = "A native whiteboard for shapes, text and Typst math, driven by a Vim grammar, with export to SVG, PNG and PDF"
keywords = ["whiteboard", "vim", "math", "diagram", "keyboard"]
categories = ["text-editors", "graphics", "mathematics"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "lawh"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
etcetera.workspace = true
lawh-core.workspace = true
lawh-math.workspace = true
lawh-render.workspace = true
softbuffer.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
winit.workspace = true

[dev-dependencies]
# The README demo writes the app's frames as PNG (`src/app/demo.rs`).
png.workspace = true

[lints]
workspace = true
