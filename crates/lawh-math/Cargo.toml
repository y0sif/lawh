[package]
name = "lawh-math"
description = "Typst math laid out to vector paths in a sandboxed worker process, with caches, bundled fonts and the :sym symbol list, for the lawh whiteboard"
keywords = ["whiteboard", "typst", "math", "vector"]
categories = ["mathematics", "graphics"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# The math worker process on its own, for tests. The app runs the same worker
# by starting itself with a hidden flag.
[[bin]]
name = "lawh-math-worker"
path = "src/bin/lawh-math-worker.rs"
test = false
doc = false

[dependencies]
codex.workspace = true
kurbo.workspace = true
thiserror.workspace = true
tracing.workspace = true
ttf-parser.workspace = true
typst.workspace = true
typst-layout.workspace = true

[target.'cfg(unix)'.dependencies]
rlimit.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
