# cargo-about: the third-party licence file in each release archive (THIRD-PARTY-LICENSES.txt).
# release.yml runs `cargo about generate --locked --fail --target <target> about.hbs` for each
# target it builds, then appends assets/licenses/EMBEDDED-NOTICES.txt (notices no Rust licence
# tool reports). Local run: cargo about generate --locked --fail about.hbs -o target/THIRD-PARTY.txt

# The licences cargo-about may pick, in order of preference: from "A OR B" it takes the first one
# listed here, so most crates resolve to MIT. The same set as deny.toml's allow list: a licence
# cargo-deny refuses never reaches this file.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
]
# Every target release.yml builds, so the platform crates (windows-sys, objc2, wayland) are known.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
# Only what is compiled into the binary: build scripts and test-only crates are not.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# lawh's own crates (publish = false): lawh's LICENSE ships next to this file.
private = { ignore = true }

# Crates whose licence files cargo-about can't match on its own (confidence below 0.8: libm's
# licence has a preamble and its copyright lines, windows-rs indents its files), so it would print
# the bare licence template with no copyright line instead. These point it at the files. A
# version bump can change a file: cargo-about then only warns ("failed to validate all files
# specified in clarification") and falls back to the template, so CI and release.yml fail on that
# warning. The fix is the new file's `sha256sum`. The windows-rs files are the same in every
# version in Cargo.lock today. For a target without Windows, cargo-about warns that the
# windows-rs entries match no crate: expected, and not a failure.
[dpi.clarify]
license = "Apache-2.0 AND MIT"

[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"

