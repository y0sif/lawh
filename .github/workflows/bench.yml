name: Bench

# Release-build timings of lawh-render: the calibrations of the frame budget's cost estimates
# (each asserts measured <= 1.2 x estimate), the text cache's memory, the worst-case boards
# (frames < 33 ms, opening < 100 ms) and the other benches. The limits were measured on the
# maintainer's laptop, so a slower or noisier runner can fail them: read the printed numbers
# either way.
#
# Then what one key may cost in lawh-core (`engine_cost`): `key_costs` times the worst cases in
# release, and `work_unit_costs` the nanoseconds a unit of work takes, in release and in debug
# (the work weights are debug timings, so a unit should stay about a nanosecond there), and
# `measure_cost` the same with text measured by the real renderer. Last, how long lawh-math
# takes to build the `:sym` list. These assert no time: read the numbers.
#
# Run by hand only (`gh workflow run bench.yml`): the repo is private and Actions minutes are
# limited.

on:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Calibrations and benches
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test --release --locked -p lawh-render -p lawh-core -p lawh-math --no-run
      # One test at a time, so timings don't share the CPU. Every step runs even when an
      # earlier one fails, so the whole picture is printed.
      - name: Calibrations
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-render --lib -- --ignored --nocapture --test-threads=1 calibrate --skip calibrate_text_memory
      # Resident memory, measured in a new process for each kind of text (the test starts them):
      # after other work, the allocator hands out memory it kept and the numbers read 0.
      - name: Text cache memory
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-render --lib -- --ignored --nocapture --test-threads=1 calibrate_text_memory
      - name: Worst cases
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-render --test bench -- --ignored --nocapture --test-threads=1 frame_budget_worst_cases
      - name: Other benches
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-render --test bench -- --ignored --nocapture --test-threads=1 --skip frame_budget_worst_cases
      - name: Key costs (release)
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-core --test engine_cost -- --ignored --nocapture --test-threads=1
      # Builds lawh-core's tests in debug: no Typst or renderer, so it is quick.
      - name: Work unit costs (debug)
        if: ${{ !cancelled() }}
        run: cargo test --locked -p lawh-core --test engine_cost -- --ignored --nocapture --test-threads=1 work_unit_costs
      # The same with text measured by the real renderer (`Measure::take_work`).
      - name: Key costs with real text layout (release)
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-render --test measure_cost -- --ignored --nocapture --test-threads=1
      - name: Symbol list
        if: ${{ !cancelled() }}
        run: cargo test --release --locked -p lawh-math --test symbols -- --ignored --nocapture --test-threads=1 measure_symbol_list
