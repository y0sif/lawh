name: Release

# Push a tag like v0.1.0 to build lawh for Linux, macOS and Windows and attach the archives to a
# draft GitHub Release: publish the draft by hand once a download has been tried. The tag is
# lawh's version in Cargo.toml with a "v", alone (v0.1.0) or with a suffix after a hyphen
# (v0.1.0-rc.1, for version 0.1.0). A tag with a hyphen becomes a pre-release. Builds are not
# code-signed: macOS Gatekeeper and Windows SmartScreen warn on first launch.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: stable
      # v{version} or v{version}-{suffix}, the suffix made of what a SemVer pre-release may hold.
      - name: Compare the tag with lawh's version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lawh") | .version')"
          if [[ -z "$version" ]]; then
            echo "::error::cargo metadata lists no lawh package"
            exit 1
          fi
          tag="${GITHUB_REF_NAME#v}"
          suffix="${tag#"$version"}"
          if [[ "$GITHUB_REF_NAME" != v* || "$tag" == "$suffix" ]] \
            || [[ -n "$suffix" && ! "$suffix" =~ ^-[0-9A-Za-z.-]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is neither v$version nor v$version-<suffix> (lawh's version in Cargo.toml)"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches lawh $version"

  ci:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  # The third-party licence file of each archive, for every target at once: cargo-about reads
  # Cargo.lock and compiles nothing, so one Linux runner does all five. (cargo-about 0.9.2 has no
  # x86_64 macOS binary, so the Intel build couldn't install it without compiling it.)
  licences:
    name: Third-party licences
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2
          fallback: none
      # cargo-about lists the crates built for each target; the embedded notices cover what it
      # can't see (see the file's header). The targets are the build matrix's: a build whose
      # file is missing fails when it packages.
      - name: One file a target
        run: |
          mkdir licences
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
            aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            log="$RUNNER_TEMP/about-$target.log"
            out="licences/THIRD-PARTY-LICENSES-$target.txt"
            status=0
            cargo about generate --locked --fail --target "$target" about.hbs -o "$out" 2> "$log" || status=$?
            cat "$log"
            if grep -q 'failed to validate' "$log"; then
              echo "::error::a clarification in about.toml no longer matches its file: update its checksum"
              exit 1
            fi
            if [[ "$status" != 0 ]]; then exit "$status"; fi
            printf '\n\n' >> "$out"
            cat assets/licenses/EMBEDDED-NOTICES.txt >> "$out"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licences
          path: licences/
          if-no-files-found: error

  build:
    name: Build (${{ matrix.target }})
    needs: [ci, licences]
    strategy:
      fail-fast: false
      matrix:
        # Each target on its own kind of runner, so every binary is run below. Linux builds in an
        # Ubuntu 22.04 container: its glibc, 2.35, is the oldest the binary runs on. Built
        # against a newer glibc, Rust's std asks for its optional functions by that glibc's
        # version (pidfd_spawnp, GLIBC_2.39 on Ubuntu 24.04), and an older glibc's loader then
        # prints "weak version `GLIBC_2.39' not found" at every start (lawh 0.1.0). An image
        # doesn't retire with a runner: ubuntu-22.04 runners are deprecated since 2026-09-17,
        # retired 2027-04-17 (actions/runner-images#14254). macos-15-intel is the last x86_64
        # macOS runner, offered until August 2027 (actions/runner-images#13045).
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 # 22.04, as of 2026-10-26
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956 # 22.04, as of 2026-10-26
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    # Empty for macOS and Windows, which build on the runner itself.
    container: ${{ matrix.container }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      # The container has no compiler, curl or git: rustup needs curl, some build scripts compile
      # C (psm, through Typst), and actions/checkout uses git.
      - name: Container packages
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # The key tells container builds apart: build scripts compiled on the runner's newer glibc
      # wouldn't run in the container.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ matrix.container && 'ubuntu-22.04' || 'runner' }}
      # Windows: the C runtime is linked into lawh.exe (+crt-static), so it runs without the
      # Visual C++ Redistributable. Only this build: CI and local builds keep the default.
      - name: Build
        shell: bash
        run: |
          if [[ "$TARGET" == *-windows-msvc ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked -p lawh --target "$TARGET"
      # dumpbin comes with the MSVC tools that linked the exe; vswhere, which Visual Studio
      # installs at a fixed path, finds it. MSYS_NO_PATHCONV keeps Git Bash from turning
      # dumpbin's /OPTIONS into paths.
      - name: No C runtime DLL
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          found="$("$vswhere" -latest -products '*' -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | tr -d '\r' | head -n 1)"
          if [[ -z "$found" ]]; then
            echo "::error::vswhere found no dumpbin.exe"
            exit 1
          fi
          dumpbin="$(cygpath -u "$found")"
          deps="$(MSYS_NO_PATHCONV=1 "$dumpbin" /NOLOGO /DEPENDENTS "target/$TARGET/release/lawh.exe" | tr -d '\r')"
          echo "$deps"
          if ! grep -qi 'kernel32\.dll' <<< "$deps"; then
            echo "::error::dumpbin listed no DLLs for lawh.exe"
            exit 1
          fi
          if grep -Eqi 'vcruntime|msvcp|ucrtbase|api-ms-win-crt' <<< "$deps"; then
            echo "::error::lawh.exe imports the C runtime: +crt-static didn't apply"
            exit 1
          fi
      # The built binary starts, and exports a board with a formula: the export compiles it in
      # the math worker, which is this binary started again. No display needed. A clean start
      # and a clean export print nothing else, so any other output fails: a formula that fails
      # ("... formula(s) failed", exit 0), a warning, or the loader's "weak version ... not
      # found" (run here on the oldest glibc the Linux builds support).
      - name: Smoke test
        shell: bash
        run: |
          bin="target/$TARGET/release/lawh"
          if [[ "$TARGET" == *windows* ]]; then bin="$bin.exe"; fi
          tmp="$RUNNER_TEMP"
          if command -v cygpath > /dev/null; then tmp="$(cygpath -m "$tmp")"; fi
          "$bin" --version 2> "$tmp/stderr.txt"
          if [[ -s "$tmp/stderr.txt" ]]; then
            cat "$tmp/stderr.txt"
            echo "::error::lawh --version printed to stderr"
            exit 1
          fi
          out="$tmp/area.svg"
          if ! note="$("$bin" export examples/area.lawh "$out" 2>&1)"; then
            echo "$note"
            echo "::error::lawh export failed"
            exit 1
          fi
          if [[ -n "$note" ]]; then
            echo "$note"
            echo "::error::lawh export printed something: a clean export prints nothing"
            exit 1
          fi
          if [[ ! -s "$out" ]]; then
            echo "::error::lawh export wrote no SVG, or an empty one"
            exit 1
          fi
          echo "area.svg: $(wc -c < "$out") bytes"
      # The newest glibc symbol version the binary asks for, weak references included: std
      # falls back when a weak one is missing, but the loader warns about its version at every
      # start. Newer than GLIBC_FLOOR (Ubuntu 22.04's, the floor the README states) fails.
      - name: glibc floor
        if: runner.os == 'Linux'
        shell: bash
        env:
          GLIBC_FLOOR: "2.35"
        run: |
          floor="$(objdump -T "target/$TARGET/release/lawh" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1)"
          floor="${floor:?no GLIBC symbol versions found}"
          floor="${floor#GLIBC_}"
          echo "lawh for $TARGET needs glibc $floor or newer"
          echo "- \`$TARGET\`: needs glibc $floor or newer" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(printf '%s\n' "$floor" "$GLIBC_FLOOR" | sort -V | tail -n 1)" != "$GLIBC_FLOOR" ]]; then
            echo "::error::lawh needs glibc $floor, newer than $GLIBC_FLOOR"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licences
          path: licences
      - name: Package
        shell: bash
        run: |
          name="lawh-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/lawh.exe" "dist/$name/"
          else
            cp "target/$TARGET/release/lawh" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cp "licences/THIRD-PARTY-LICENSES-$TARGET.txt" "dist/$name/THIRD-PARTY-LICENSES.txt"
          # The binary embeds the bundled fonts; OFL-1.1 requires their licences alongside.
          cp assets/fonts/Inter-OFL.txt assets/fonts/Libertinus-OFL.txt "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lawh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lawh-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
