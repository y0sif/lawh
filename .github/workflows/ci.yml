name: CI

# Pushes to main and pull requests run the checks on Linux, macOS and Windows. Standard GitHub
# runners are free for public repositories. The release workflow calls this one first
# (workflow_call), so a tag only builds archives from a commit that passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Full debug info for every test binary filled the Linux runner's disk during
      # `cargo test` (PR #2). Line tables keep file and line numbers in backtraces. Set on
      # macOS and Windows too, so their test binaries are smaller as well and the three
      # platforms build the same profile.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The third-party licence file each release archive carries (release.yml): fails when a crate's
  # licence can't be read or a clarification in about.toml no longer matches its file (cargo-about
  # only warns about that), so a dependency bump shows it here rather than on a release tag.
  licence-file:
    name: Third-party licence file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # Every target in about.toml at once.
      - name: Generate
        run: |
          log="$RUNNER_TEMP/about.log"
          status=0
          cargo about generate --locked --fail about.hbs -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" 2> "$log" || status=$?
          cat "$log"
          if grep -q 'failed to validate' "$log"; then
            echo "::error::a clarification in about.toml no longer matches its file: update its checksum"
            exit 1
          fi
          exit "$status"

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      # `+1.95` overrides rust-toolchain.toml, which pins stable.
      - run: cargo +1.95 check --workspace --all-targets --locked
