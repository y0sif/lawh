name: CI

# Pushes to main and pull requests run the checks on Linux (x86_64 and arm64), macOS and Windows.
# Standard GitHub runners are free for public repositories. The release workflow calls this one
# first (workflow_call), so a tag only builds archives from a commit that passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: the arm64 Linux archive's platform, tested on every pull request.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Full debug info for every test binary filled the Linux runner's disk during
      # `cargo test` (PR #2). Line tables keep file and line numbers in backtraces. Set on
      # every runner, so all test binaries are smaller and every platform builds the same
      # profile.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # --no-fail-fast: one platform's failures all show in one run.
      - run: cargo test --workspace --locked --no-fail-fast

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The third-party licence file each release archive carries (release.yml): fails when a crate's
  # licence can't be read or a clarification in about.toml no longer matches its file (cargo-about
  # only warns about that), so a dependency bump shows it here rather than on a release tag.
  licence-file:
    name: Third-party licence file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-about@0.9.2
          fallback: none
      # Every target in about.toml at once.
      - name: Generate
        run: |
          log="$RUNNER_TEMP/about.log"
          status=0
          cargo about generate --locked --fail about.hbs -o "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt" 2> "$log" || status=$?
          cat "$log"
          if grep -q 'failed to validate' "$log"; then
            echo "::error::a clarification in about.toml no longer matches its file: update its checksum"
            exit 1
          fi
          exit "$status"

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master branch as of 2026-10-16
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `+1.95` overrides rust-toolchain.toml, which pins stable.
      - run: cargo +1.95 check --workspace --all-targets --locked
