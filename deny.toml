# cargo-deny: licence, advisory, ban and source checks. Runs in CI.
# Local run: cargo deny check

[graph]
all-features = false

[advisories]
# Only fail on unmaintained crates we depend on directly. The rest arrive through Typst's tree
# (bincode, paste, rustybuzz, yaml-rust) and are out of our hands.
unmaintained = "workspace"
ignore = [
    # quick-xml 0.38 comes only through hayagriva -> citationberg in typst-library. Both bugs are
    # denial of service when parsing CSL styles, reachable only via `cite` and `bibliography`,
    # which lawh-math removes from the Typst library (crates/lawh-math/src/world.rs).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via citationberg; cite/bibliography removed from Typst" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via citationberg; cite/bibliography removed from Typst" },
    # ttf-parser is Typst's own font type: Font::ttf() returns a ttf_parser::Face, so reading glyph
    # outlines needs it directly. Revisit when Typst moves off it.
    { id = "RUSTSEC-2026-0192", reason = "Typst's font type; needed to read glyph outlines" },
]

[licenses]
# lawh is MIT. Permissive licences, plus file-level copyleft (MPL-2.0, used by nucleo) and font
# licences. GPL, LGPL and AGPL are deliberately absent: adding one needs a decision, not a config edit.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "OFL-1.1",
]
confidence-threshold = 0.8
# Some of the list is pre-approved for planned dependencies (see docs/tech-stack.md).
unused-allowed-license = "allow"

[bans]
# The Vello and Typst ecosystems pull in some duplicate versions; flag them without failing.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
