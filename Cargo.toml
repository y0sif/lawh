[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Highest MSRV among planned dependencies (kdl 6.7 needs 1.95).
rust-version = "1.95"
license = "MIT"
authors = ["y0sif <yosifsoli981@gmail.com>"]
repository = "https://github.com/y0sif/lawh"
homepage = "https://github.com/y0sif/lawh"
# The repo is private until the app has been tested. Flip this when it goes public.
publish = false

[workspace.dependencies]
lawh-core = { path = "crates/lawh-core", version = "0.1.0" }
lawh-math = { path = "crates/lawh-math", version = "0.1.0" }
lawh-render = { path = "crates/lawh-render", version = "0.1.0" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
kurbo = "0.13.1"
thiserror = "2.0.21"
insta = "1.49.0"
proptest = "1.11.0"
# Typst is pinned exactly: lawh-math walks its frame types, which change between releases.
typst = "=0.15.1"
typst-layout = "=0.15.1"
# Same version Typst uses; only for the glyph outline trait.
ttf-parser = { version = "0.25.1", default-features = false }
# Caps the math worker process's address space on Unix (lawh-math worker_main).
rlimit = "0.11.0"
# Rendering. kurbo above must stay the version vello_cpu re-exports.
vello_cpu = "0.3.0"
# No `system` feature: lawh never loads system fonts, and it would need fontconfig.
parley = { version = "0.12.0", default-features = false, features = ["std", "bytemuck"] }
bytemuck = "1.25.2"
# App. winit keeps its default features: X11 and Wayland libraries are loaded at run time, so
# building needs no system packages.
winit = "0.30.13"
softbuffer = "0.4.8"
anyhow = "1.0.104"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

# CI runs clippy with -D warnings, so every warning here fails the build.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that cost more than they catch in this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
# Restriction lints we opt into. Tests are exempt via clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

# Debug builds optimise dependencies and the app's own pixel loop, so panning is smooth in dev.
# Measured in debug at 1920x1080 (area.lawh):
# - all dependencies at opt-level 2: lawh-render's bench went from 116 ms to 1.3 ms a frame.
#   A cold `cargo build` went from 2.5 to 8 minutes; incremental builds of our crates are unchanged.
# - lawh-render at opt-level 1 on top: no measurable gain, so it stays at 0 and easy to step through.
# - lawh at opt-level 2: copying a frame to the window went from 35 ms (opt 0) and 3.2 ms (opt 1)
#   to 1 ms. The crate is small, so this costs about a second per build.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.lawh]
opt-level = 2
